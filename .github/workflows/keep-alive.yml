name: Keep Render App Alive

# Render's free tier spins down web services after ~15 minutes of no
# inbound traffic, and the next request then pays a ~30-60s "cold start"
# penalty. This workflow pings the app on a schedule so it never goes
# idle long enough to spin down.

on:
  schedule:
    # Every 10 minutes. Render's free-tier idle timeout is 15 minutes,
    # so 10-minute pings comfortably keep it warm. GitHub Actions cron
    # can run a few minutes late under load, so don't push this much
    # closer to 15.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          # RENDER_URL should be set as a repository variable,
          # e.g. https://kisan-saathi.onrender.com/
          # --max-time 60: gives the app enough time to wake up from a
          # cold start (spinning up from sleep can take 30-60s+).
          # --retry 3 --retry-delay 10: retries a couple of times in case
          # the first request hits the app mid-boot and gets a 502/503.
          # -f: treat non-2xx responses as failures too, so a failed run
          # in the Actions tab doubles as basic uptime monitoring.
          curl -sf --max-time 60 --retry 3 --retry-delay 10 "${{ vars.RENDER_URL }}" -o /dev/null
        shell: bash